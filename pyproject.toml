[project]
name = "ingest"
version = "0.1.0"
description = "Приём алертов и выкаток AIIP"
requires-python = ">=3.14"
dependencies = [
    "aiip-kit @ https://github.com/AI-Incident-Investigation-Platform/aiip-kit/archive/refs/tags/v0.1.0.tar.gz",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "httptools>=0.9.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b1",
]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["case(id): сценарий из tests/scenarios.toml"]

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
