apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ingest
spec:
  scaleTargetRef: {name: ingest}
  minReplicaCount: 2
  maxReplicaCount: 4
  pollingInterval: 5
  fallback: {failureThreshold: 3, replicas: 2}
  triggers:
    - type: cpu
      metricType: AverageValue
      metadata: {value: 500m}
