apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels: {app: ingest}
spec:
  selector:
    matchLabels: {app: ingest}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  progressDeadlineSeconds: 120
  template:
    metadata:
      labels: {app: ingest}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingest
          image: aiip-ingest:latest
          env:
            - name: SERVICE__BIND_HOST
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 8005
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: secret
              mountPath: /app/config.toml
              subPath: config.toml
      volumes:
        - name: secret
          secret: {secretName: ingest}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector: {app: ingest}
  ports:
    - name: http
      port: 8005
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ingest-ratelimit
spec:
  rateLimit:
    average: 30
    burst: 50
    period: 1s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingest
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-ingest-ratelimit@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/ingest
            pathType: Prefix
            backend:
              service:
                name: ingest
                port: {name: http}
